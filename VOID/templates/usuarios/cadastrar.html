{% extends "base.html" %}
{% block titulo %}Cadastro de Usuários{% endblock %}

{% block conteudo %}
<h1 class="titulo-secao mb-4">{% if usuario %}Editar Usuário{% else %}Cadastro de Usuários{% endif %}</h1>

<div class="card card-void p-4">
  <form method="POST"
        action="{% if usuario %}{{ url_for('editar_usuario', id=usuario.id) }}{% else %}{{ url_for('cadastrar_usuario') }}{% endif %}">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="nome">Nome</label>
        <input class="form-control" id="nome" name="nome" value="{{ usuario.nome if usuario else '' }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="email">Email</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ usuario.email if usuario else '' }}" required>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="celular">Celular</label>
        <input class="form-control" id="celular" name="celular" placeholder="11999999999" value="{{ usuario.celular if usuario else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label" for="nascimento">Data de Nascimento</label>
        <input type="date" class="form-control" id="nascimento" name="nascimento" value="{{ usuario.nascimento if usuario else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label" for="cpf">CPF</label>
        <input class="form-control" id="cpf" name="cpf" placeholder="000.000.000-00" value="{{ usuario.cpf if usuario else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label" for="nivel">Nível de Acesso</label>
        <select class="form-select" id="nivel" name="nivel">
          {% for n in ["Usuário", "Administrador"] %}
            <option value="{{ n }}" {% if usuario and usuario.nivel == n %}selected{% endif %}>{{ n }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="cep">CEP</label>
        <input class="form-control" id="cep" name="cep" placeholder="00000-000" value="{{ usuario.cep if usuario else '' }}">
      </div>
      <div class="col-md-8">
        <label class="form-label" for="endereco">Endereço</label>
        <input class="form-control" id="endereco" name="endereco" value="{{ usuario.endereco if usuario else '' }}">
      </div>
      <div class="col-md-2">
        <label class="form-label" for="numero">Número</label>
        <input class="form-control" id="numero" name="numero" value="{{ usuario.numero if usuario else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="complemento">Complemento</label>
        <input class="form-control" id="complemento" name="complemento" value="{{ usuario.complemento if usuario else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label" for="cidade">Cidade</label>
        <input class="form-control" id="cidade" name="cidade" value="{{ usuario.cidade if usuario else '' }}">
      </div>
      <div class="col-md-2">
        <label class="form-label" for="estado">Estado</label>
        <select class="form-select" id="estado" name="estado">
          {% for uf in estados %}
            <option value="{{ uf }}" {% if usuario and usuario.estado == uf %}selected{% endif %}>{{ uf }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="d-flex flex-wrap gap-2 justify-content-end mt-4">
      <a href="{{ url_for('listar_usuarios') }}" class="btn btn-outline-void">Voltar</a>
      <button type="reset" class="btn btn-secondary-void">Limpar</button>
      <button type="submit" class="btn btn-void">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}
