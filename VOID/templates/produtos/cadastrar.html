{% extends "base.html" %}
{% block titulo %}Cadastro de Produtos{% endblock %}

{% block conteudo %}
<h1 class="titulo-secao mb-4">{% if produto %}Editar Produto{% else %}Cadastro de Produtos{% endif %}</h1>

<div class="card card-void p-4">
  <form method="POST"
        action="{% if produto %}{{ url_for('editar_produto', id=produto.id) }}{% else %}{{ url_for('cadastrar_produto') }}{% endif %}">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="nome">Nome do Produto</label>
        <input class="form-control" id="nome" name="nome" value="{{ produto.nome if produto else '' }}" required>
      </div>
      <div class="col-md-3">
        <label class="form-label" for="categoria">Categoria</label>
        <select class="form-select" id="categoria" name="categoria">
          {% for c in categorias %}
            <option value="{{ c }}" {% if produto and produto.categoria == c %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label" for="tamanho">Tamanho</label>
        <select class="form-select" id="tamanho" name="tamanho">
          {% for t in tamanhos %}
            <option value="{{ t }}" {% if produto and produto.tamanho == t %}selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="cor">Cor</label>
        <input class="form-control" id="cor" name="cor" value="{{ produto.cor if produto else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label" for="preco">Preço (R$)</label>
        <input type="number" step="0.01" min="0" class="form-control" id="preco" name="preco" value="{{ produto.preco if produto else '' }}" required>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="estoque">Estoque</label>
        <input type="number" min="0" class="form-control" id="estoque" name="estoque" value="{{ produto.estoque if produto else '' }}" required>
      </div>
      <div class="col-12">
        <label class="form-label" for="descricao">Descrição</label>
        <textarea class="form-control" id="descricao" name="descricao" rows="3">{{ produto.descricao if produto else '' }}</textarea>
      </div>
      <div class="col-12">
        <label class="form-label" for="imagem">Imagem (URL)</label>
        <input type="url" class="form-control" id="imagem" name="imagem" placeholder="https://..." value="{{ produto.imagem if produto else '' }}">
      </div>
    </div>

    <div class="d-flex flex-wrap gap-2 justify-content-end mt-4">
      <a href="{{ url_for('listar_produtos') }}" class="btn btn-outline-void">Voltar</a>
      <button type="reset" class="btn btn-secondary-void">Limpar</button>
      <button type="submit" class="btn btn-void">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}
