{% extends "base.html" %}
{% block titulo %}Cadastro de Pedidos{% endblock %}

{% block conteudo %}
<h1 class="titulo-secao mb-4">{% if pedido %}Editar Pedido{% else %}Cadastro de Pedidos{% endif %}</h1>

<div class="card card-void p-4">
  <form method="POST"
        action="{% if pedido %}{{ url_for('editar_pedido', id=pedido.id) }}{% else %}{{ url_for('cadastrar_pedido') }}{% endif %}">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label" for="numero">Número do Pedido</label>
        <input class="form-control" id="numero" name="numero" placeholder="#005" value="{{ pedido.numero if pedido else '' }}" required>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="cliente">Cliente</label>
        <select class="form-select" id="cliente" name="cliente">
          {% for u in usuarios %}
            <option value="{{ u.nome }}" {% if pedido and pedido.cliente == u.nome %}selected{% endif %}>{{ u.nome }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="produto">Produto</label>
        <select class="form-select" id="produto" name="produto">
          {% for p in produtos %}
            <option value="{{ p.nome }}" data-preco="{{ p.preco }}" {% if pedido and pedido.produto == p.nome %}selected{% endif %}>{{ p.nome }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label" for="quantidade">Quantidade</label>
        <input type="number" min="1" class="form-control" id="quantidade" name="quantidade" value="{{ pedido.quantidade if pedido else 1 }}" required>
      </div>
      <div class="col-md-3">
        <label class="form-label" for="valor">Valor Total (R$)</label>
        <input type="number" step="0.01" min="0" class="form-control" id="valor" name="valor" value="{{ pedido.valor if pedido else '' }}" required>
      </div>
      <div class="col-md-3">
        <label class="form-label" for="status">Status</label>
        <select class="form-select" id="status" name="status">
          {% for s in status_lista %}
            <option value="{{ s }}" {% if pedido and pedido.status == s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label" for="data">Data do Pedido</label>
        <input type="date" class="form-control" id="data" name="data" value="{{ pedido.data if pedido else '' }}" required>
      </div>
    </div>

    <div class="d-flex flex-wrap gap-2 justify-content-end mt-4">
      <a href="{{ url_for('listar_pedidos') }}" class="btn btn-outline-void">Voltar</a>
      <button type="reset" class="btn btn-secondary-void">Limpar</button>
      <button type="submit" class="btn btn-void">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}
